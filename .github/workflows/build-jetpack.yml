name: Build Custom NPCs Mod

on:
  push:
    branches: [arena/85c3b2ef-airplane-flight]
    paths:
      - 'jetpack-mod/**'
      - '.github/workflows/build-jetpack.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
          cache-read-only: false

      - name: Warm dependency cache
        working-directory: jetpack-mod
        continue-on-error: true
        run: gradle :dependencies --no-daemon --refresh-dependencies || true

      - name: Build mod
        working-directory: jetpack-mod
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build-output.txt 2>&1
          code=$?
          tail -n 150 build-output.txt
          if [ $code -ne 0 ]; then
            echo "::error::Custom NPCs build failed with exit code $code"
            grep -E "FAILURE|What went wrong|Could not|error:|Exception|Caused by|not found|Failed to|command not found" build-output.txt | head -15 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::$esc"
            done
          fi
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          tail -n 200 jetpack-mod/build-output.txt > failure.txt 2>/dev/null || echo "No build output captured." > failure.txt
          gh issue create --title "Custom NPCs build failed (run ${{ github.run_id }})" --body-file failure.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: customnpcs-1.20.1
          path: jetpack-mod/build/libs/customnpcs-1.1.1.jar

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customnpcs-v1.1.1
          name: 'Custom NPCs v1.1.1 (Minecraft 1.20.1 Forge)'
          body: |
            ## Custom NPCs 1.1.1

            `/npc help` and `/npc list` are open to every player now. Before, the
            whole command was operator-only, so the help text promised by the
            previous release was unreachable for ordinary players. Everything
            that changes the world still requires permission level 2.

            Setup is now inside the game instead of in the release notes.

            - **`/npc help`** prints the whole flow in chat, and bare `/npc`
              does the same, so a player who installs this and reads nothing
              can still place and configure an NPC.
            - **The editor has a skin field** with Steve and Alex shortcuts.
              Type any texture path, such as
              `customnpcs:textures/entity/guard.png`, and a resource pack can
              supply custom 64x64 skins.
            - **Help text under the editor** explains each setting in one line.
            - **`config/customnpcs-common.toml`** for server owners:
              `allowEditing`, `ownerOnlyEditing`, `defaultScale`,
              `defaultInvulnerable`, `maxNpcsPerPlayer`, `wandRange`.
              Operators always bypass the editing restrictions.

            A patch release for three bugs that only appeared once the mod was
            actually loaded: NPC attributes were registered on the wrong event
            bus, names never appeared above NPCs, and NPCs could spawn on their
            own. All three are fixed.

            Place custom characters in your world: give them a name, a skin, a
            voice line and a job, then leave them there. Built for **Minecraft
            1.20.1 Forge**.

            ### What you can do
            - **Spawn an NPC** with the *NPC Spawner* item, or from the console
              with `/npc spawn <name>`.
            - **Edit it in game** by right-clicking with the *NPC Editor Wand*:
              name, dialogue line, behaviour, scale, hostility, invulnerability,
              and what it holds in its hand or wears on its head.
            - **Clone a character** by sneak-right-clicking an NPC with the wand,
              then right-clicking the ground to place copies — a whole crowd of
              the same character, without retyping anything.
            - **Let it live its life**: *Wander* walks around its home spot,
              *Follow* stays with its owner and catches up if left behind,
              *Guard* stands still and turns to watch players go by.
            - **Talk to it**: right-click with an empty hand to get its dialogue
              line in chat, prefixed with its name.
            - **NPCs persist**: they never despawn, and name, skin, behaviour,
              dialogue, scale and equipment are all saved in the world file and
              synced to every player.

            ### Commands
            | Command | What it does |
            | --- | --- |
            | `/npc spawn <name>` | place an NPC where you stand |
            | `/npc list` | every NPC within 128 blocks, with behaviour and scale |
            | `/npc remove` | remove the nearest NPC |
            | `/npc removeall` | remove every NPC within 256 blocks |
            | `/npc behaviour wander\|follow\|guard` | set what the nearest NPC does |
            | `/npc name <name>` | rename the nearest NPC |
            | `/npc dialogue <text>` | set its line |
            | `/npc scale <50–200>` | resize it |
            | `/npc hostile on\|off` | make it fight players and monsters |
            | `/npc invulnerable on\|off` | protect it from everything but editing |

            ### Crafting
            - **NPC Spawner** — gold ingots, ender pearls, a diamond in the middle.
            - **NPC Editor Wand** — two sticks and an amethyst shard.

            Both are also in the Spawn Eggs creative tab.

            ### Skins
            The skin field takes `steve`, `alex`, or a full texture path such as
            `customnpcs:textures/entity/guard.png`, so a resource pack can supply
            your own 64×64 skins and the NPCs will wear them.

            ### Install
            1. Install **Forge 47.2.0+** for Minecraft 1.20.1
            2. **Delete any older jetpack jar** from the mods folder — this
               replaces it entirely
            3. Put `customnpcs-1.1.1.jar` into `mods`
            4. Launch, craft the spawner, right-click the ground
          files: jetpack-mod/build/libs/customnpcs-1.1.1.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
