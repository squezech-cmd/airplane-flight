name: Build Jetpack Mod

on:
  push:
    branches: [arena/85c3b2ef-airplane-flight]
    paths:
      - 'jetpack-mod/**'
      - '.github/workflows/build-jetpack.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
          cache-read-only: false

      - name: Warm dependency cache
        working-directory: jetpack-mod
        continue-on-error: true
        run: gradle :dependencies --no-daemon --refresh-dependencies || true

      - name: Build mod
        working-directory: jetpack-mod
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build-output.txt 2>&1
          code=$?
          tail -n 150 build-output.txt
          if [ $code -ne 0 ]; then
            echo "::error::Jetpack build failed with exit code $code"
            grep -E "FAILURE|What went wrong|Could not|error:|Exception|Caused by|not found|Failed to|command not found" build-output.txt | head -15 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::$esc"
            done
          fi
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          tail -n 200 jetpack-mod/build-output.txt > failure.txt 2>/dev/null || echo "No build output captured." > failure.txt
          gh issue create --title "Jetpack build failed (run ${{ github.run_id }})" --body-file failure.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetpack-1.20.1
          path: jetpack-mod/build/libs/jetpack-3.1.0.jar

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jetpack-v3.1.0
          name: 'Jetpack v3.1.0 (Minecraft 1.20.1 Forge)'
          body: |
            ## Jetpack 3.1.0 — Voice Chat

            Talk to the people around you, in game, with no extra mods and no
            external libraries. Open the settings with the **Voice chat** button
            in the pause menu, with **Left Alt**, or with `/voice`.

            ### How it works
            - **Push to talk** is the default: hold **V** while you play and
              release to stop. Switch to an open microphone in the settings if
              you prefer.
            - **Proximity based** — your voice carries 32 blocks by default and
              gets quieter with distance, so a group standing together sounds
              like a group standing together.
            - **Hearing range** is adjustable from 8 to 128 blocks, and everyone
              sees who is close enough to talk to.
            - **A live level meter** shows your microphone in real time, so you
              can set the gain without guessing.
            - **The HUD** shows when you are transmitting and who is speaking
              near you.

            ### Settings screen
            | Setting | What it does |
            | --- | --- |
            | Voice chat on/off | master switch |
            | Push to talk / open mic | how the microphone is triggered |
            | Microphone on/off | manual override |
            | Mic gain | 25% to 300%, with a meter next to it |
            | Range | how far your voice carries, 8–128 blocks |
            | Volume | how loud you hear everyone else |
            | Noise gate | below this level nothing is sent, so breathing and fans stay private |
            | Device | pick which microphone to use |
            | Monitor | play your own microphone back so you can check how you sound |
            | HUD | show or hide the corner indicator |

            ### Commands
            | Command | What it does |
            | --- | --- |
            | `/voice` | open the settings screen |
            | `/voice mute` / `/voice unmute` | stop or resume hearing everyone |
            | `/voice range <8–128>` | set how far your voice carries |
            | `/voice mode on/off` | operator: switch voice chat on the whole server |
            | `/voice muteplayer <player>` | operator: mute one player |

            ### Bandwidth
            Microphone audio is decimated to 16 kHz wideband speech and compressed
            with G.711 mu-law. That is **16 KB/s per speaker** instead of 96 KB/s of
            raw audio, and the server only sends a voice frame to players inside the
            speaker's range. The mod is pure Java: nothing to install, nothing to
            download at runtime, and it still loads on a dedicated server.

            ### Also in this build
            Everything from 3.0.0: the three rebuilt Christmas trees, the eleven
            placeable decorations, the `/jetpack` blizzard commands, 24 blocks and
            83 recipes.

            ### Install
            1. Install **Forge 47.2.0+** for Minecraft 1.20.1
            2. **Delete any older jetpack jar** from the mods folder
            3. Put `jetpack-3.1.0.jar` into `mods`
            4. Launch — hold SPACE to fly, hold V to talk
          files: jetpack-mod/build/libs/jetpack-3.1.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
