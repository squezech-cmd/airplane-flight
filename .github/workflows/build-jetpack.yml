name: Build Jetpack Mod

on:
  push:
    branches: [arena/85c3b2ef-airplane-flight]
    paths:
      - 'jetpack-mod/**'
      - '.github/workflows/build-jetpack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        working-directory: jetpack-mod
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build-output.txt 2>&1
          code=$?
          tail -n 150 build-output.txt
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          tail -n 200 jetpack-mod/build-output.txt > failure.txt 2>/dev/null || echo "No build output captured." > failure.txt
          gh issue create --title "Jetpack build failed (run ${{ github.run_id }})" --body-file failure.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetpack-1.20.1
          path: jetpack-mod/build/libs/jetpack-1.0.0.jar

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jetpack-v1.0.0
          name: 'Jetpack v1.0.0 (Minecraft 1.20.1 Forge)'
          body: |
            ## Jetpack — Minecraft 1.20.1 (Forge)

            A cool jetpack mod! Grab the **Jetpack** from the creative inventory
            (tab "Jetpack"), equip it on your chest and hold **SPACE** to fly.

            - Fuel gauge on the item, refuels automatically
            - Flame particles and rocket sound while flying
            - Soft landing: no fall damage with the jetpack on

            ### Install
            1. Install **Forge 47.2.0+** for Minecraft 1.20.1
            2. Put `jetpack-1.0.0.jar` into the `mods` folder
            3. Launch the game and fly!
          files: jetpack-mod/build/libs/jetpack-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
