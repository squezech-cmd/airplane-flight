name: Build Jetpack Mod

on:
  push:
    branches: [arena/85c3b2ef-airplane-flight]
    paths:
      - 'jetpack-mod/**'
      - '.github/workflows/build-jetpack.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
          cache-read-only: false

      - name: Warm dependency cache
        working-directory: jetpack-mod
        continue-on-error: true
        run: gradle :dependencies --no-daemon --refresh-dependencies || true

      - name: Build mod
        working-directory: jetpack-mod
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build-output.txt 2>&1
          code=$?
          tail -n 150 build-output.txt
          if [ $code -ne 0 ]; then
            echo "::error::Jetpack build failed with exit code $code"
            grep -E "FAILURE|What went wrong|Could not|error:|Exception|Caused by|not found|Failed to|command not found" build-output.txt | head -15 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::$esc"
            done
          fi
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          tail -n 200 jetpack-mod/build-output.txt > failure.txt 2>/dev/null || echo "No build output captured." > failure.txt
          gh issue create --title "Jetpack build failed (run ${{ github.run_id }})" --body-file failure.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetpack-1.20.1
          path: jetpack-mod/build/libs/jetpack-3.0.0.jar

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jetpack-v3.0.0
          name: 'Jetpack v3.0.0 (Minecraft 1.20.1 Forge)'
          body: |
            ## Jetpack 2.1.1 — Winter Wonderland (Minecraft 1.20.1 Forge)

            **Hotfix:** 2.1.0 crashed on startup with
            `ExceptionInInitializerError: null` because `fairy_lights` was registered
            twice — once as the wall block and once as a decoration item. That item is
            now called **String Lights**, and the mod loads cleanly.

            The jetpack, plus a whole Christmas world. Everything lives in two creative
            tabs: **Jetpack** and **Jetpack Christmas**.

            ### 71 items, all craftable
            - **16 decorations**: snowflake, jingle bell, tinsel, string lights,
              gingerbread man and house, nutcracker, rocking horse, toy train, drum,
              stocking, mitten, three glass baubles, star garland
            - **14 sweets**: peppermint candy, candy apple, chocolate bar, gingerbread
              cookie, Christmas pudding, fruitcake, roasted chestnuts, marshmallow,
              Christmas cake, sugar plum, snow cone, sweet cane, marzipan pig, yule log
            - **6 hot drinks**: eggnog, mulled cider, peppermint tea, Christmas punch,
              snowberry smoothie, warm cocoa — each with its own buff
            - **8 trinkets**: ice shard, frozen heart, snowy pearl, lucky snowball,
              stardust, mistletoe, holly berries, pine cone
            - **4 frost tools**: sword (chills on hit), pickaxe, axe, shovel
            - **5 materials**: wrapping paper, red and gold bows, pine needles, snow dust
            - **67 recipes** in total

            ### Blocks
            Grand Christmas Tree (two blocks tall, twinkling star), Christmas Tree,
            Snowman, Wreath, Fairy Lights, Holly Bush, Snow Pile, Candy Cane,
            Snow Lantern and three wrapped presents that pop open when used.

            ### Real winter weather
            - **Blizzards** roll in every few minutes: dense sideways snow, gusting wind,
              ground drift and a chill in the air, announced in chat
            - **Snowfall** follows every player all the time
            - **Ground frost** slowly paints the world white
            - **Rain turns into snow** and drifts pile up into layers

            ### Animations
            Twinkling stars on trees, sparkles wherever you walk, frosty breath when it
            snows, shooting stars on clear nights, and lights that flicker on their wire.

            ### Install
            1. Install **Forge 47.2.0+** for Minecraft 1.20.1
            2. **Delete any older jetpack jar** from the mods folder first
            3. Put `jetpack-3.0.0.jar` into `mods`
            4. Launch the game — hold SPACE to fly, and enjoy the snow
          files: jetpack-mod/build/libs/jetpack-3.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
