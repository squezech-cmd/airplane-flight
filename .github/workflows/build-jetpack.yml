name: Build Jetpack Mod

on:
  push:
    branches: [arena/85c3b2ef-airplane-flight]
    paths:
      - 'jetpack-mod/**'
      - '.github/workflows/build-jetpack.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        working-directory: jetpack-mod
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build-output.txt 2>&1
          code=$?
          tail -n 150 build-output.txt
          if [ $code -ne 0 ]; then
            echo "::error::Jetpack build failed with exit code $code"
            grep -E "FAILURE|What went wrong|Could not|error:|Exception|Caused by|not found|Failed to|command not found" build-output.txt | head -15 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::$esc"
            done
          fi
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          tail -n 200 jetpack-mod/build-output.txt > failure.txt 2>/dev/null || echo "No build output captured." > failure.txt
          gh issue create --title "Jetpack build failed (run ${{ github.run_id }})" --body-file failure.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetpack-1.20.1
          path: jetpack-mod/build/libs/jetpack-1.1.0.jar

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jetpack-v1.1.0
          name: 'Jetpack v1.1.0 (Minecraft 1.20.1 Forge)'
          body: |
            ## Jetpack — Minecraft 1.20.1 (Forge)

            A cool jetpack mod! Grab the **Jetpack** from the creative inventory
            (tab "Jetpack"), equip it on your chest and hold **SPACE** to fly.

            ### What's new in 1.1.0
            - **Flight actually works now** — thrust is applied on the client, so holding
              SPACE lifts you off the ground and keeps you climbing.
            - **Brand new 3D model on your back** — twin red fuel tanks, a steel spine
              plate and two glowing thruster nozzles.
            - **New textures** for the item and the worn model.
            - Hold **SHIFT** while flying to descend faster.

            ### Features
            - Fuel gauge on the item, refuels automatically when the thrusters are off
            - Flame and smoke particles plus a rocket sound while flying
            - Soft landing: the jetpack catches you and you never take fall damage

            ### Install
            1. Install **Forge 47.2.0+** for Minecraft 1.20.1
            2. Put `jetpack-1.1.0.jar` into the `mods` folder
            3. Launch the game and fly!
          files: jetpack-mod/build/libs/jetpack-1.1.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
