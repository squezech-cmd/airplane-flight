name: Build Jetpack Mod

on:
  push:
    branches: [arena/85c3b2ef-airplane-flight]
    paths:
      - 'jetpack-mod/**'
      - '.github/workflows/build-jetpack.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
          cache-read-only: false

      - name: Warm dependency cache
        working-directory: jetpack-mod
        continue-on-error: true
        run: gradle :dependencies --no-daemon --refresh-dependencies || true

      - name: Build mod
        working-directory: jetpack-mod
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build-output.txt 2>&1
          code=$?
          tail -n 150 build-output.txt
          if [ $code -ne 0 ]; then
            echo "::error::Jetpack build failed with exit code $code"
            grep -E "FAILURE|What went wrong|Could not|error:|Exception|Caused by|not found|Failed to|command not found" build-output.txt | head -15 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::$esc"
            done
          fi
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          tail -n 200 jetpack-mod/build-output.txt > failure.txt 2>/dev/null || echo "No build output captured." > failure.txt
          gh issue create --title "Jetpack build failed (run ${{ github.run_id }})" --body-file failure.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetpack-1.20.1
          path: jetpack-mod/build/libs/jetpack-3.0.0.jar

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jetpack-v3.0.0
          name: 'Jetpack v3.0.0 (Minecraft 1.20.1 Forge)'
          body: |
            ## Jetpack 3.0.0 — Trees, Decorations & Blizzard Commands

            Big one: the trees were rebuilt from scratch, every decoration became a
            real block you can place, and the weather is now under your control.

            ### Three Christmas trees, all rebuilt
            - **Giant Christmas Tree** — **3 blocks tall**, 186 model elements, eight
              drooping tiers, a garland of coloured bulbs spiralling 2.6 times around
              the trunk, fifteen baubles and a four-armed glowing star. Light 14.
            - **Grand Christmas Tree** — 2 blocks, 128 elements, light 12
            - **Christmas Tree** — 1 block, light 11
            - Every tree is a cascade of branch plates with drooping boughs, not a
              stack of cubes. Only the trunk is solid, so you can walk underneath.
            - Breaking any part takes the whole tree down and drops a single item.
            - **The trees were broken before:** `big_christmas_tree` had no crafting
              recipe at all, and the giant tree's item icon was an invalid model the
              game refuses to load. Both are fixed.

            ### Eleven decorations you can actually place
            Toy train, little drum, rocking horse, nutcracker, gingerbread man,
            gingerbread house, stocking, mitten, jingle bell, box of baubles and a
            jar of candy. Each one is a detailed 3D model with its own collision
            box, facing direction, light level and idle particles — and each still
            has its crafting recipe.

            ### Blizzard commands
            | Command | What it does |
            | --- | --- |
            | `/jetpack blizzard` | start a 45 second blizzard now |
            | `/jetpack blizzard <seconds>` | 1–600 seconds |
            | `/jetpack blizzard stop` | end it early |
            | `/jetpack snow` | toggle the ambient snowfall |
            | `/jetpack auto on/off` | automatic blizzards every 6 minutes |

            ### Everything else from before
            The jetpack with its 3D back model and fuel gauge, 43 Christmas items,
            24 blocks, **83 recipes**, presents that pop open, frost tools, and the
            snowfall, ground frost and rain-turns-to-snow weather.

            ### Install
            1. Install **Forge 47.2.0+** for Minecraft 1.20.1
            2. **Delete any older jetpack jar** from the mods folder first
            3. Put `jetpack-3.0.0.jar` into `mods`
            4. Launch — hold SPACE to fly, then try `/jetpack blizzard`
          files: jetpack-mod/build/libs/jetpack-3.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
