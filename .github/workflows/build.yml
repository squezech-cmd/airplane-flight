name: Build Windows x64

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Unity Build (Windows x64)
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout (с LFS и полной историей — нужно unity-builder для версионирования).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # 2) Кэш Unity Library (ускоряет повторные сборки в разы).
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      # 3) Сборка через game-ci (образ unityci/editor:windows-2022.3.62f1-* подбирается
      #    автоматически по ProjectVersion.txt).
      #    Нужны секреты: UNITY_LICENSE (содержимое .ulf), UNITY_EMAIL, UNITY_PASSWORD.
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: DearPassengers
          buildsPath: builds
          buildMethod: DearPassengers.EditorTools.BuildScript.Build

      # 3.5) One-click установщик «под ключ» (self-extracting exe):
      #      один файл → распаковка в %LOCALAPPDATA%\DearPassengers → ярлыки → игра.
      - name: Create one-click installer
        run: |
          pip install py7zr
          cp installer/SetupUI.ps1 installer/SetupUI.bat builds/
          python3 installer/make_setup.py --mode game --payload builds --out DearPassengers_Setup.exe

      # 4) Артефакт (доступен на каждой сборке, даже без релиза).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DearPassengers-Windows-x64
          path: |
            builds/
            DearPassengers_Setup.exe

      # 5) Релиз при пуше тега v*.
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd builds
          zip -r ../DearPassengers-Windows-x64.zip .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DearPassengers-Windows-x64.zip
            DearPassengers_Setup.exe
          body: |
            Dear Passengers v${{ github.ref_name }} — Windows x64.

            ⚠️ 18+ | Создана в развлекательных целях. Не повторяйте в реальной жизни. Все совпадения случайны.

            **Под ключ (как в Steam):** скачайте `DearPassengers_Setup.exe` — один файл, двойной клик,
            игра ставится в %LOCALAPPDATA%\DearPassengers, ярлыки на рабочем столе и в «Пуске», запуск автоматический.
            Альтернатива: `DearPassengers-Windows-x64.zip` — распакуйте и запустите DearPassengers.exe.
